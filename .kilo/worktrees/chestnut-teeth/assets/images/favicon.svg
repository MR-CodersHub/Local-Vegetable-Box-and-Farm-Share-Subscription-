<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031C13"/>
      <stop offset="45%" stop-color="#083325"/>
      <stop offset="100%" stop-color="#114C37"/>
    </linearGradient>

    <!-- Glass/Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Wood Crate Gradients -->
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAA153"/>
      <stop offset="35%" stop-color="#CD7C2E"/>
      <stop offset="100%" stop-color="#9C5217"/>
    </linearGradient>
    <linearGradient id="woodSlatLower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C97829"/>
      <stop offset="45%" stop-color="#A85C1A"/>
      <stop offset="100%" stop-color="#7C3B0B"/>
    </linearGradient>
    <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE903E"/>
      <stop offset="50%" stop-color="#AA5E1D"/>
      <stop offset="100%" stop-color="#70360A"/>
    </linearGradient>

    <!-- Vegetable Gradients -->
    <!-- Carrot -->
    <linearGradient id="carrotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA83D"/>
      <stop offset="40%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#C43400"/>
    </linearGradient>
    <linearGradient id="carrotLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="55%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Tomato -->
    <radialGradient id="tomatoBody" cx="30%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="28%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>

    <!-- Lettuce / Greens -->
    <linearGradient id="greensLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="45%" stop-color="#16A34A"/>
      <stop offset="85%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="greensBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Sweet Corn -->
    <linearGradient id="cornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Eggplant -->
    <radialGradient id="eggplantGrad" cx="30%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#9333EA"/>
      <stop offset="80%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </radialGradient>

    <!-- Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#010D09" flood-opacity="0.6"/>
    </filter>
    <filter id="crateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  <rect x="2" y="2" width="60" height="26" rx="15" fill="url(#glossGrad)"/>
  <!-- Rim -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.3"/>

  <!-- Warm Sun Glow behind vegetables -->
  <circle cx="32" cy="22" r="16" fill="#FBBF24" fill-opacity="0.2"/>

  <!-- ================= VEGETABLES ================= -->
  
  <!-- 1. Rich Organic Leafy Greens (Left) -->
  <g id="greens">
    <!-- Big back frond -->
    <path d="M19 30 C13 21 16 11 25 12 C27 18 25 25 22 31 Z" fill="url(#greensLeft)"/>
    <path d="M19 22 C22 17 24 14 25 12" fill="none" stroke="#DCFCE7" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Outer curly spinach leaf -->
    <circle cx="15.5" cy="24.5" r="5.5" fill="#15803D"/>
    <circle cx="15" cy="24" r="4.2" fill="#22C55E"/>
    
    <!-- Mid ruffled kale/lettuce leaf -->
    <path d="M21 29 C22 19 27 11 32 13 C33 20 29 26 25 31 Z" fill="url(#greensBack)"/>
    <path d="M24 22 C27 17 29 14 32 13" fill="none" stroke="#DCFCE7" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 2. Sweet Golden Corn (Right) -->
  <g id="corn" transform="rotate(15 44 21)">
    <rect x="40.5" y="13" width="8" height="17" rx="4" fill="url(#cornGrad)"/>
    <!-- Kernels -->
    <line x1="41.5" y1="17" x2="47.5" y2="17" stroke="#78350F" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="41.5" y1="21" x2="47.5" y2="21" stroke="#78350F" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="41.5" y1="25" x2="47.5" y2="25" stroke="#78350F" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- Husk leaves -->
    <path d="M39.5 23 C38.5 20 40.5 16 41.5 16 C40.5 20 41.5 25 41.5 28 Z" fill="#4ADE80"/>
    <path d="M49.5 23 C50.5 20 48.5 16 47.5 16 C48.5 20 47.5 25 47.5 28 Z" fill="#22C55E"/>
  </g>

  <!-- 3. Eggplant / Purple Veggie (Far Right) -->
  <g id="eggplant">
    <ellipse cx="46.5" cy="31" rx="5.8" ry="6.8" transform="rotate(12 46.5 31)" fill="url(#eggplantGrad)"/>
    <!-- Specular highlight -->
    <ellipse cx="45" cy="28" rx="1.8" ry="1.1" transform="rotate(-25 45 28)" fill="#FFFFFF" fill-opacity="0.55"/>
    <!-- Green stem -->
    <path d="M47.5 25 C46.5 23 48.5 21 47.5 19 C48.5 21.5 50.5 23 49.5 26 Z" fill="#15803D"/>
    <circle cx="47.5" cy="24.8" r="1.3" fill="#22C55E"/>
  </g>

  <!-- 4. Fresh Crunchy Carrot (Center-Left, tilted) -->
  <g id="carrot">
    <!-- Green Fronds/Feathers -->
    <path d="M29 16 C28 8 32 5 34 6 C33 10 31 14 29 17 Z" fill="url(#carrotLeaf)"/>
    <path d="M26 15 C23 9 26 5 28 6 C27 10 28 14 27 16 Z" fill="#15803D"/>
    <path d="M31 14 C33 9 37 8 38 10 C36 13 34 15 32 16 Z" fill="#86EFAC"/>
    
    <!-- Carrot Root -->
    <path d="M23.5 20.5 C30.5 19 34 23 32 25.5 L24 38 C23 39 21.6 39 21.2 38 C20.6 37 21.2 36 21.8 34 L23.5 20.5 Z" fill="url(#carrotBody)"/>
    <!-- Texture lines -->
    <path d="M24 24 Q26.5 25.5 29.5 24" fill="none" stroke="#FED7AA" stroke-width="1" stroke-linecap="round"/>
    <path d="M23 28.5 Q25.5 30 28 29" fill="none" stroke="#C2410C" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M22 33 Q23.8 34.2 25.5 33.5" fill="none" stroke="#C2410C" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 5. Ripe Juicy Red Tomato (Center-Right foreground) -->
  <g id="tomato">
    <!-- Shadow under tomato -->
    <ellipse cx="36.5" cy="34" rx="8.5" ry="6.5" fill="#000000" fill-opacity="0.32"/>
    <!-- Tomato Sphere -->
    <circle cx="36.5" cy="30.5" r="8.5" fill="url(#tomatoBody)"/>
    <!-- Specular Highlight Curve -->
    <ellipse cx="33.5" cy="27" rx="2.8" ry="1.6" transform="rotate(-30 33.5 27)" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="36" cy="25" r="0.8" fill="#FFFFFF" fill-opacity="0.45"/>
    <!-- Green Star Calyx -->
    <path d="M36.5 22.5 L37.8 19.5 L36 22 L33.5 20.5 L35.2 22.8 L34 24.5 L36.3 23.3 L38.8 24.5 L37.5 22.8 Z" fill="#22C55E"/>
    <circle cx="36.5" cy="22.5" r="1.2" fill="#15803D"/>
  </g>

  <!-- ================= HARVEST WOODEN CRATE ================= -->
  <g id="wooden-crate" filter="url(#crateShadow)">
    <!-- Back Interior Depth -->
    <polygon points="10.5,34 53.5,34 51,37 13,37" fill="#3B1502" fill-opacity="0.9"/>

    <!-- Upper Main Slat -->
    <rect x="9.5" y="36" width="45" height="9.5" rx="1.8" fill="url(#woodFront)"/>
    <!-- Top Highlight -->
    <line x1="10.5" y1="37" x2="53.5" y2="37" stroke="#FEF3C7" stroke-width="0.9" stroke-opacity="0.75"/>
    <!-- Slat Bottom Shadow -->
    <line x1="10" y1="45" x2="54" y2="45" stroke="#3B1502" stroke-width="0.9"/>

    <!-- Gap between slats -->
    <rect x="10.5" y="45.5" width="43" height="2" fill="#200B01"/>

    <!-- Lower Main Slat -->
    <rect x="9.5" y="47.5" width="45" height="10" rx="1.8" fill="url(#woodSlatLower)"/>
    <!-- Lower Slat Top Highlight -->
    <line x1="10.5" y1="48.5" x2="53.5" y2="48.5" stroke="#FDBA74" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Lower Slat Bottom Shadow -->
    <line x1="10" y1="57" x2="54" y2="57" stroke="#3B1502" stroke-width="0.8"/>

    <!-- Left Corner Post -->
    <rect x="8.5" y="35" width="5.2" height="23" rx="1.2" fill="url(#woodPost)"/>
    <line x1="9.3" y1="35.5" x2="9.3" y2="57.5" stroke="#FEF3C7" stroke-width="0.7" stroke-opacity="0.75"/>
    <!-- Left Nails -->
    <circle cx="11.1" cy="39.5" r="0.9" fill="#1C1917"/>
    <circle cx="11.3" cy="39.3" r="0.4" fill="#E7E5E4"/>
    <circle cx="11.1" cy="52.5" r="0.9" fill="#1C1917"/>
    <circle cx="11.3" cy="52.3" r="0.4" fill="#E7E5E4"/>

    <!-- Right Corner Post -->
    <rect x="50.3" y="35" width="5.2" height="23" rx="1.2" fill="url(#woodPost)"/>
    <line x1="51.1" y1="35.5" x2="51.1" y2="57.5" stroke="#FEF3C7" stroke-width="0.7" stroke-opacity="0.75"/>
    <!-- Right Nails -->
    <circle cx="52.9" cy="39.5" r="0.9" fill="#1C1917"/>
    <circle cx="53.1" cy="39.3" r="0.4" fill="#E7E5E4"/>
    <circle cx="52.9" cy="52.5" r="0.9" fill="#1C1917"/>
    <circle cx="53.1" cy="52.3" r="0.4" fill="#E7E5E4"/>

    <!-- Handle Cutout in Center of Upper Slat -->
    <rect x="24.5" y="39.2" width="15" height="3.5" rx="1.75" fill="#1C0A01"/>
    <rect x="25" y="39.7" width="14" height="2.5" rx="1.25" fill="#0D0400"/>
    <line x1="25.5" y1="42.7" x2="38.5" y2="42.7" stroke="#FDBA74" stroke-width="0.5" stroke-opacity="0.6"/>

    <!-- Engraved Double-Leaf Sprout on Lower Slat -->
    <g transform="translate(32, 53) scale(0.7)">
      <!-- Left Leaf -->
      <path d="M0 0 C-4 -6 -9 -2 -5 2 C-2 5 0 7 0 7 Z" fill="#451A03" fill-opacity="0.85"/>
      <!-- Right Leaf -->
      <path d="M0 0 C4 -6 9 -2 5 2 C2 5 0 7 0 7 Z" fill="#451A03" fill-opacity="0.85"/>
      <!-- Stem -->
      <path d="M0 0 L0 8" stroke="#451A03" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/>
    </g>
  </g>

  <!-- Fresh Basil / Sprout Leaf Draping over crate rim -->
  <g id="draping-leaf">
    <path d="M19 37.5 C17 35.5 18 32.5 21.5 32.5 C23.5 34.5 22.5 38.5 19 39.5 Z" fill="#4ADE80"/>
    <path d="M19 37.5 C18.5 36.5 19.5 34.5 21.5 32.5" fill="none" stroke="#DCFCE7" stroke-width="0.6"/>
  </g>
</svg>
